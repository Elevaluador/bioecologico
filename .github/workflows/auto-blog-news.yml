name: 🌾 Auto-Blog Generator

on:
  # Ejecutar diariamente a las 8:00 AM UTC (5:00 AM Piura)
  schedule:
    - cron: '0 8 * * *'
  
  # Permitir ejecución manual desde GitHub
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Ejecutar en modo test (no hacer push)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    name: 📝 Generar Blog Post
    timeout-minutes: 30

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Configurar Git
        run: |
          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"
          git config --global user.name "🤖 Bioecológico Bot"

      - name: 🟢 Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'scripts/package-lock.json'

      - name: 📦 Instalar dependencias
        run: |
          cd scripts
          npm ci --legacy-peer-deps
          echo "✅ Dependencias instaladas"

      - name: 🤖 Ejecutar Auto-Blog Generator
        env:
          # APIs
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          # GitHub
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          GIT_USER_NAME: "🤖 Bioecológico Bot"
          
          # Email
          EMAIL_SERVICE: "gmail"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          REVIEWER_EMAIL: ${{ secrets.REVIEWER_EMAIL }}
          
          # Blog
          SITE_URL: "https://www.bioecologico.online"
        run: |
          cd scripts
          node index.js

      - name: ✅ Proceso completado
        if: success()
        run: echo "🎉 Blog post generado exitosamente y PR creado"

      - name: ⚠️ Error en el proceso
        if: failure()
        run: |
          echo "❌ Falló la generación del blog post"
          echo "📋 Revisa los logs arriba para más detalles"
          exit 1